<!DOCTYPE html>
<html>
<head>
<title>Verify OTP</title>

<style>

body{
margin:0;
height:100vh;
font-family:Arial;
background:url("/static/bg.jpeg") no-repeat center center/cover;
display:flex;
justify-content:center;
align-items:center;
}

.glass{
background:rgba(0,0,0,0.55);
padding:40px;
border-radius:20px;
width:360px;
text-align:center;
color:white;
backdrop-filter:blur(10px);
}

input{
width:100%;
padding:12px;
margin:12px 0;
border-radius:25px;
border:none;
}

button{
padding:12px 25px;
border-radius:25px;
border:none;
background:white;
font-weight:bold;
cursor:pointer;
}

</style>
</head>

<body>

<div class="glass">

<h2>Verify OTP</h2>

<form method="POST">

<input type="text"
name="otp"
placeholder="Enter OTP"
required>

<input type="password"
name="password"
placeholder="New Password"
required>

<button type="submit">
Reset Password
</button>

</form>

</div>

</body>
</html>
