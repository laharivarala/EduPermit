<!DOCTYPE html>
<html>

<head>
<title>Director Management Dashboard</title>

<style>

body{
margin:0;
font-family:Arial;
background:url("/static/bg.jpeg") no-repeat center center/cover;
color:white;
}

body::before{
content:"";
position:fixed;
width:100%;
height:100%;
background:rgba(0,0,0,0.85);
z-index:-1;
}

.container{
width:90%;
margin:120px auto;
text-align:center;
}

h1{
font-size:40px;
margin-bottom:50px;
}

.cards{
display:flex;
justify-content:center;
gap:40px;
flex-wrap:wrap;
}

.card{
width:260px;
padding:35px;
border-radius:20px;
background:rgba(255,255,255,0.08);
backdrop-filter:blur(12px);
transition:0.3s;
cursor:pointer;
}

.card:hover{
transform:scale(1.05);
background:rgba(255,255,255,0.15);
}

.card h3{
margin-bottom:10px;
}

.card p{
font-size:14px;
color:#ddd;
}

.card a{
text-decoration:none;
color:white;
}

</style>

</head>

<body>

{% include "_navbar.html" %}

<div class="container">

<h1>Director Management Dashboard</h1>

<div class="cards">

<div class="card">
<a href="/director_approvals">
<h3>Approvals</h3>
<p>
Review and finalize permission requests that have successfully passed CEER and all Department HOD approvals.
</p>
</a>
</div>

<div class="card">
<a href="/director_history">
<h3>History</h3>
<p>
Access previously reviewed requests and maintain institutional records of Director decisions.
</p>
</a>
</div>

</div>

</div>

</body>
</html>
