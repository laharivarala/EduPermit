<!DOCTYPE html>
<html>
<head>
<title>Faculty Dashboard</title>

<style>

body{
margin:0;
font-family:Arial;
background:url("/static/bg.jpeg") no-repeat center center/cover;
color:white;
}

body::before{
content:"";
position:fixed;
width:100%;
height:100%;
background:rgba(0,0,0,0.85);
z-index:-1;
}

.container{
width:80%;
margin:120px auto;
text-align:center;
}

.year-grid{
display:grid;
grid-template-columns:repeat(2,1fr);
gap:40px;
margin-top:40px;
}

.year-card{
background:rgba(255,255,255,0.08);
padding:40px;
border-radius:20px;
font-size:30px;
font-weight:bold;
cursor:pointer;
transition:0.3s;
}

.year-card:hover{
transform:scale(1.05);
background:rgba(255,255,255,0.15);
}

</style>

</head>

<body>

{% include "_navbar.html" %}

<div class="container">

<h1>Faculty Dashboard</h1>

<div class="year-grid">

{% for y in years %}

<a href="/faculty_year/{{y}}" style="text-decoration:none;color:white;">
<div class="year-card">

Year {{y}}

</div>
</a>

{% endfor %}

</div>

</div>

</body>
</html>
