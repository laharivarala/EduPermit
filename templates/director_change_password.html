<!DOCTYPE html>
<html>

<head>
<title>Change Password</title>

<style>

body{
margin:0;
font-family:Arial;
background:url("/static/bg.jpeg") no-repeat center center/cover;
height:100vh;
display:flex;
align-items:center;
justify-content:center;
}

body::before{
content:"";
position:fixed;
width:100%;
height:100%;
background:rgba(0,0,0,0.45);   /* lighter overlay */
z-index:-1;
}

.box{
background:rgba(255,255,255,0.12);
padding:45px;
border-radius:20px;
width:360px;
text-align:center;
backdrop-filter:blur(15px);
box-shadow:0 0 25px rgba(0,0,0,0.6);
}

h2{
color:white;
margin-bottom:25px;
font-size:30px;
}

input{
width:100%;
padding:12px;
margin:10px 0;
border:none;
border-radius:20px;
outline:none;
background:#f0f0f0;
}

button{
width:100%;
padding:12px;
margin-top:10px;
border:none;
border-radius:20px;
background:#3498db;
color:white;
cursor:pointer;
font-weight:bold;
}

button:hover{
background:#2c80b4;
}

</style>
</head>

<body>

<div class="box">

<h2>Change Password</h2>

<form method="POST">

<input type="password" name="new_password" placeholder="Enter New Password" required>

<input type="password" name="confirm_password" placeholder="Confirm Password" required>

<button type="submit">Update Password</button>

</form>

</div>

</body>

</html>
