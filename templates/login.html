<!DOCTYPE html>
<html>
<head>
<title>Login</title>

<style>

body{
margin:0;
height:100vh;
font-family: Arial, Helvetica, sans-serif;
background:url("/static/bg.jpeg") no-repeat center center/cover;
display:flex;
justify-content:center;
align-items:center;
}

.glass{
background: rgba(0,0,0,0.55);
border-radius:20px;
padding:45px;
width:360px;
text-align:center;
backdrop-filter:blur(12px);
box-shadow:0 8px 30px rgba(0,0,0,0.5);
color:white;
}

h1{
margin-bottom:25px;
}

input{
width:100%;
padding:12px;
margin:12px 0;
border-radius:25px;
border:none;
outline:none;
font-size:15px;
}

.loginbtn{
margin-top:10px;
padding:12px 28px;
border-radius:25px;
border:none;
background:white;
cursor:pointer;
font-weight:bold;
}

.linkbtn{
margin-top:15px;
padding:12px;
width:100%;
border-radius:25px;
border:none;
background:white;
cursor:pointer;
font-weight:bold;
}

.forgot{
color:#ddd;
font-size:14px;
text-decoration:none;
display:block;
margin-top:5px;
}

a{
text-decoration:none;
color:black;
}

.flash{
position:fixed;
top:20px;
left:50%;
transform:translateX(-50%);
padding:15px 25px;
border-radius:10px;
color:white;
font-weight:bold;
z-index:9999;
}

.success{ background:green; }
.error{ background:red; }

</style>
</head>

<body>

<!-- FLASH MESSAGE -->
{% with messages = get_flashed_messages(with_categories=true) %}
{% if messages %}
{% for category, message in messages %}
<div class="flash {{category}}" id="flashMessage">
{{ message }}
</div>
{% endfor %}
{% endif %}
{% endwith %}

<div class="glass">

<h1>Login</h1>

<form method="POST">

<input type="email"
name="email"
placeholder="Enter Your Email"
required>

<input type="password"
name="password"
placeholder="Enter Your Password"
required>

<a href="/forgot" class="forgot">Forgot Password?</a>

<button class="loginbtn" type="submit">Login</button>

</form>

<br>

<a href="/register">
<button class="linkbtn">
Don't have an account? Register
</button>
</a>

</div>

<script>
/* auto hide flash message */
setTimeout(function(){
let flash = document.getElementById("flashMessage");
if(flash){
flash.style.display="none";
}
},3000);
</script>

</body>
</html>
