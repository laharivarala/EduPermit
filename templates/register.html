<!DOCTYPE html>
<html>
<head>
    <title>Register</title>

    <style>
        body{
            margin:0;
            height:100vh;
            font-family: Arial, Helvetica, sans-serif;
            background:url("/static/bg.jpeg") no-repeat center center/cover;
            display:flex;
            justify-content:center;
            align-items:center;
        }

        .glass{
            background: rgba(0, 0, 0, 0.55);
            border-radius: 20px;
            padding: 45px;
            width: 360px;
            text-align: center;
            backdrop-filter: blur(12px);
            box-shadow: 0 8px 30px rgba(0,0,0,0.5);
            color: white;
        }

        h1{
            margin-bottom:25px;
        }

        input{
            width:100%;
            padding:12px;
            margin:12px 0;
            border-radius:25px;
            border:none;
            outline:none;
            font-size:15px;
        }

        .btn{
            margin-top:10px;
            padding:12px 28px;
            border-radius:25px;
            border:none;
            background:white;
            cursor:pointer;
            font-weight:bold;
        }

        .linkbtn{
            margin-top:15px;
            padding:12px;
            width:100%;
            border-radius:25px;
            border:none;
            background:white;
            cursor:pointer;
        }

        a{
            text-decoration:none;
            color:black;
            font-weight:bold;
        }
    </style>
</head>

<body>

<!-- FLASH MESSAGE BOX -->
{% with messages = get_flashed_messages(with_categories=true) %}
  {% if messages %}
    {% for category, message in messages %}
      <div style="
          position:fixed;
          top:20px;
          left:50%;
          transform:translateX(-50%);
          padding:15px 25px;
          border-radius:10px;
          color:white;
          font-weight:bold;
          background-color:{% if category=='success' %}green{% else %}red{% endif %};
          z-index:9999;">
        {{ message }}
      </div>
    {% endfor %}
  {% endif %}
{% endwith %}

<div class="glass">
    <h1>Register (Only for Students)</h1>

    <form method="POST">

        <input type="email"
               name="email"
               placeholder="Enter College Email (@cmrcet.ac.in)"
               pattern=".+@cmrcet\.ac\.in"
               title="Use your college mail only"
               required>

        <input type="password"
               name="password"
               placeholder="Enter Password"
               required>

        <button class="btn" type="submit">Register</button>
    </form>

    <br>

    <a href="/login">
        <button class="linkbtn">Already have an account? Login</button>
    </a>
</div>

</body>
</html>
