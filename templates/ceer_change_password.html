<!DOCTYPE html>
<html>
<head>
<title>Change Password</title>

<style>
body{
    margin:0;
    height:100vh;
    font-family: Arial, Helvetica, sans-serif;
    background:url("/static/bg.jpeg") no-repeat center center/cover;
    display:flex;
    justify-content:center;
    align-items:center;
}

/* GLASS CARD */
.glass{
    background: rgba(0, 0, 0, 0.55);
    border-radius: 20px;
    padding: 45px;
    width: 360px;
    text-align: center;
    backdrop-filter: blur(12px);
    box-shadow: 0 8px 30px rgba(0,0,0,0.5);
    color: white;
}

h1{
    margin-bottom:25px;
}

/* INPUTS */
input{
    width:100%;
    padding:12px;
    margin:12px 0;
    border-radius:25px;
    border:none;
    outline:none;
    font-size:15px;
}

/* BUTTON */
.btn{
    margin-top:15px;
    padding:12px 28px;
    border-radius:25px;
    border:none;
    background:white;
    cursor:pointer;
    font-weight:bold;
    width:100%;
}
</style>

<script>
function validatePassword(){
    let pass = document.getElementById("pass").value;
    let confirm = document.getElementById("confirm").value;

    if(pass !== confirm){
        alert("Passwords do not match!");
        return false;
    }
    return true;
}
</script>

</head>

<body>

<div class="glass">
    <h1>Change Password</h1>

    <form method="POST" onsubmit="return validatePassword()">

        <input type="password"
               id="pass"
               name="new_password"
               placeholder="Enter New Password"
               required>

        <input type="password"
               id="confirm"
               placeholder="Confirm Password"
               required>

        <button class="btn" type="submit">Update Password</button>

    </form>

</div>

</body>
</html>
