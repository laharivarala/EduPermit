<!DOCTYPE html>
<html>
<head>
    <title>Verify OTP</title>

    <style>
        body{
            margin:0;
            height:100vh;
            font-family: Arial, Helvetica, sans-serif;
            background:url("/static/bg.jpeg") no-repeat center center/cover;
            display:flex;
            justify-content:center;
            align-items:center;
        }

        .glass{
            background: rgba(0, 0, 0, 0.55);
            border-radius: 20px;
            padding: 45px;
            width: 360px;
            text-align: center;
            backdrop-filter: blur(12px);
            box-shadow: 0 8px 30px rgba(0,0,0,0.5);
            color: white;
        }

        input{
            width:100%;
            padding:12px;
            margin:15px 0;
            border-radius:25px;
            border:none;
            outline:none;
        }

        button{
            padding:12px 25px;
            border-radius:25px;
            border:none;
            background:white;
            font-weight:bold;
            cursor:pointer;
        }
    </style>
</head>

<body>

<div class="glass">
    <h2>Enter OTP</h2>

    <form method="POST">
        <input type="text"
               name="otp"
               placeholder="Enter OTP"
               required>

        <button type="submit">Verify OTP</button>
    </form>
</div>

</body>
</html>
