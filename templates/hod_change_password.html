<!DOCTYPE html>
<html>
<head>
<title>Change Password</title>

<style>
body{
    margin:0;
    height:100vh;
    font-family: Arial, Helvetica, sans-serif;
    background:url("/static/bg.jpeg") no-repeat center center/cover;
    display:flex;
    justify-content:center;
    align-items:center;
}

/* GLASS CARD */
.glass{
    background: rgba(0, 0, 0, 0.55);
    border-radius: 20px;
    padding: 45px;
    width: 360px;
    text-align: center;
    backdrop-filter: blur(12px);
    box-shadow: 0 8px 30px rgba(0,0,0,0.5);
    color: white;
}

h1{
    margin-bottom:25px;
}

/* INPUTS */
input{
    width:100%;
    padding:12px;
    margin:12px 0;
    border-radius:25px;
    border:none;
    outline:none;
    font-size:15px;
}

/* BUTTON */
.resetbtn{
    margin-top:15px;
    padding:12px 28px;
    border-radius:25px;
    border:none;
    background:white;
    cursor:pointer;
    font-weight:bold;
    width:100%;
}

/* ERROR TEXT */
.error{
    color:#ff6b6b;
    font-size:14px;
    display:none;
}
</style>

<script>
function validateForm(){
    var p1 = document.getElementById("pass1").value;
    var p2 = document.getElementById("pass2").value;
    var error = document.getElementById("error");

    if(p1 !== p2){
        error.style.display = "block";
        return false;
    }
    return true;
}
</script>
</head>

<body>

<div class="glass">
    <h1>Change Password</h1>

    <form method="POST" onsubmit="return validateForm()">

        <input type="password"
               id="pass1"
               name="newpass"
               placeholder="Enter New Password"
               required>

        <input type="password"
               id="pass2"
               placeholder="Confirm New Password"
               required>

        <div id="error" class="error">Passwords do not match</div>

        <button class="resetbtn" type="submit">Reset Password</button>
    </form>

</div>

</body>
</html>
