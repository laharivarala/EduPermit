<!DOCTYPE html>
<html>

<head>
<title>Forgot Password</title>

<style>

body{
margin:0;
height:100vh;
font-family: Arial, Helvetica, sans-serif;
background:url("/static/bg.jpeg") no-repeat center center/cover;
display:flex;
justify-content:center;
align-items:center;
}

/* GLASS CARD */
.container{
background:rgba(0,0,0,0.6);
padding:40px;
border-radius:20px;
width:360px;
text-align:center;
color:white;
backdrop-filter:blur(10px);
box-shadow:0 10px 40px rgba(0,0,0,0.5);
}

/* TITLE */
h2{
margin-bottom:25px;
}

/* INPUT */
input{
width:100%;
padding:12px;
margin:12px 0;
border:none;
border-radius:25px;
outline:none;
font-size:14px;
}

/* BUTTON */
button{
padding:12px 30px;
border:none;
border-radius:25px;
background:#27ae60;
color:white;
font-weight:bold;
cursor:pointer;
transition:0.25s;
}

button:hover{
transform:scale(1.05);
}

/* BACK LINK */
.back{
display:block;
margin-top:18px;
color:#ccc;
text-decoration:none;
font-size:14px;
}

.back:hover{
color:white;
}

</style>
</head>

<body>

<div class="container">

<h2>Forgot Password</h2>

<form method="POST">

<input type="email"
name="email"
placeholder="Enter Registered Email"
required>

<button type="submit" name="action" value="send_otp">
Send OTP
</button>

</form>

<a href="/login" class="back">Back to Login</a>

</div>

</body>
</html>
