<!DOCTYPE html>
<html>

<head>
<title>Director Login</title>

<style>

body{
margin:0;
font-family:Arial;
background:url("/static/bg.jpeg") no-repeat center center/cover;
height:100vh;
display:flex;
align-items:center;
justify-content:center;
}

body::before{
content:"";
position:fixed;
width:100%;
height:100%;
background:rgba(0,0,0,0.45);   /* lighter overlay */
z-index:-1;
}

.login-box{
background:rgba(255,255,255,0.12);
padding:45px;
border-radius:20px;
width:360px;
text-align:center;
backdrop-filter:blur(15px);
box-shadow:0 0 25px rgba(0,0,0,0.6);
}

h2{
color:white;
margin-bottom:30px;
font-size:34px;
font-weight:bold;
}

input{
width:100%;
padding:12px;
margin:10px 0;
border:none;
border-radius:20px;
outline:none;
background:#f0f0f0;
font-size:14px;
}

button{
width:100%;
padding:12px;
margin-top:10px;
border:none;
border-radius:20px;
background:#3498db;
color:white;
cursor:pointer;
font-weight:bold;
font-size:14px;
}

button:hover{
background:#2c80b4;
}

.forgot{
margin-top:12px;
display:block;
color:white;
font-size:14px;
text-decoration:none;
}

.forgot:hover{
text-decoration:underline;
}

.back-btn{
margin-top:15px;
background:#555;
}

.back-btn:hover{
background:#444;
}

</style>
</head>

<body>

<div class="login-box">

<h2>Director Login</h2>

<form method="POST">

<input type="email" name="email" placeholder="Enter Director Email" required>

<input type="password" name="password" placeholder="Enter Password" required>

<button type="submit">Login</button>

</form>

<a href="/director_forgot" class="forgot">Forgot Password?</a>

<a href="/">
<button class="back-btn">← Back</button>
</a>

</div>

</body>
</html>
