<!DOCTYPE html>
<html>
<head>
<title>HOD Forgot Password</title>

<style>

body{
margin:0;
height:100vh;
font-family:Arial;
background:url("/static/bg.jpeg") no-repeat center center/cover;
display:flex;
justify-content:center;
align-items:center;
}

.container{
background:rgba(0,0,0,0.65);
padding:40px;
border-radius:20px;
width:360px;
text-align:center;
color:white;
backdrop-filter:blur(10px);
}

input{
width:100%;
padding:12px;
margin:12px 0;
border-radius:25px;
border:none;
}

button{
padding:12px 25px;
border-radius:25px;
border:none;
background:#27ae60;
color:white;
font-weight:bold;
cursor:pointer;
}

.back{
margin-top:15px;
display:block;
color:#ccc;
text-decoration:none;
}

</style>
</head>

<body>

<div class="container">

<h2>HOD Forgot Password</h2>

<form method="POST">

<input type="email"
name="email"
placeholder="Enter Registered Email"
required>

<button type="submit">
Send OTP
</button>

</form>

<a href="/hod_login" class="back">Back to Login</a>

</div>

</body>
</html>
