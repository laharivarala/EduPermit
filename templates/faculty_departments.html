<!DOCTYPE html>
<html>
<head>
<title>Departments</title>

<style>

body{
margin:0;
font-family:Arial;
background:url("/static/bg.jpeg") no-repeat center center/cover;
color:white;
}

body::before{
content:"";
position:fixed;
width:100%;
height:100%;
background:rgba(0,0,0,0.85);
z-index:-1;
}

.container{
width:80%;
margin:120px auto;
text-align:center;
}

.grid{
display:grid;
grid-template-columns:repeat(4,1fr);
gap:25px;
margin-top:40px;
}

.card{
background:rgba(255,255,255,0.08);
padding:30px;
border-radius:15px;
font-size:22px;
font-weight:bold;
cursor:pointer;
transition:0.3s;
}

.card:hover{
transform:scale(1.05);
background:rgba(255,255,255,0.15);
}

</style>

</head>

<body>

{% include "_navbar.html" %}

<div class="container">

<h2>Year {{year}} Departments</h2>

<div class="grid">

{% for dep in departments %}

<a href="/faculty_sections/{{year}}/{{dep}}" style="text-decoration:none;color:white;">

<div class="card">

{{dep}}

</div>

</a>

{% endfor %}

</div>

</div>

</body>
</html>
