<!DOCTYPE html>
<html>
<head>
<title>Verify OTP</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    font-family:Segoe UI, Arial, sans-serif;
}

/* FULL BACKGROUND */
body{
    height:100vh;
    background:url("/static/bg.jpeg") no-repeat center center/cover;
    display:flex;
    justify-content:center;
    align-items:center;
    position:relative;
}

/* DARK OVERLAY */
body::before{
    content:"";
    position:absolute;
    width:100%;
    height:100%;
    background:rgba(0,0,0,0.45);
    backdrop-filter:blur(2px);
}

/* GLASS CARD */
.glass{
    position:relative;
    width:380px;
    padding:45px 40px;
    border-radius:18px;
    background:rgba(0,0,0,0.55);
    backdrop-filter:blur(12px);
    box-shadow:0 15px 45px rgba(0,0,0,0.6);
    text-align:center;
    color:white;
    animation:fade 0.6s ease;
}

@keyframes fade{
    from{opacity:0; transform:translateY(20px);}
    to{opacity:1; transform:translateY(0);}
}

h2{
    margin-bottom:25px;
    font-weight:600;
}

/* INPUT */
input{
    width:100%;
    padding:14px;
    border:none;
    outline:none;
    border-radius:30px;
    margin:14px 0;
    font-size:14px;
    background:#f1f1f1;
}

/* BUTTON */
button{
    width:170px;
    padding:12px;
    border:none;
    border-radius:25px;
    background:white;
    color:black;
    font-weight:bold;
    cursor:pointer;
    transition:0.25s;
}

button:hover{
    transform:scale(1.05);
    background:#f4f4f4;
}
</style>
</head>

<body>

<div class="glass">
    <h2>Verify OTP</h2>

    <form method="POST">
        <input type="text" name="otp" placeholder="Enter OTP" required>
        <input type="password" name="password" placeholder="New Password" required>
        <button type="submit">Reset Password</button>
    </form>
</div>

</body>
</html>
